wandb_log: false
wandb_project: GAMPFN
wandb_name: gampfn_additive_stage1
device: cuda
dtype: bfloat16
np_seed: 43
torch_seed: 43
max_steps: 100000
batch_size: 64
micro_batch_size: 8
lr: 8.0e-4
muon: true
beta1: 0.9
weight_decay: 0.01
use_cautious_wd: false
scheduler: cosine_with_restarts
warmup_proportion: 0.01
cosine_num_cycles: 1
cosine_amplitude_decay: 1
cosine_lr_end: 1.0e-7
gradient_clipping: 10.0

regression_method: additive
effect_loss_weight: 1.0

prior_type: gam
prior_device: cpu
n_jobs: 16
batch_size_per_gp: 8
min_features: 1
max_features: 100
max_seq_len: 1024
min_train_size: 0.3
max_train_size: 0.9
seq_len_per_gp: true
gam_rich: true
gam_strong_interaction_heredity: false
gam_categorical_probability: 0.2
gam_interaction_probability: 0.0
gam_max_interactions: 0
gam_max_interaction_fraction: 0.0
gam_heteroscedastic_probability: 0.5
gam_outlier_probability: 0.1

embed_dim: 128
col_num_blocks: 3
col_nhead: 8
col_num_inds: 128
col_ssmax: true
row_num_blocks: 1
row_nhead: 8
additive_num_memory_tokens: 8
additive_num_row_inds: 32
additive_num_decoder_blocks: 2
additive_decoder_chunk_size: 64
ssmax_type: qassmax-mlp-elementwise
ff_factor: 2
dropout: 0.0
norm_first: true
zero_init: false
use_flash_attn3: false
norm_type: layernorm_nobias
recompute: true

checkpoint_dir: checkpoints/gampfn/additive_stage1
save_temp_every: 500
save_perm_every: 5000
